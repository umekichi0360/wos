<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOS Commander Select-Mode</title>
    <style>
        :root { --primary: #ff4b5c; --secondary: #00d2ff; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #4ade80; --warning: #ffeb3b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; height: 100dvh; display: flex; flex-direction: column; }
        
        #auth-screen { position: fixed; inset: 0; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); padding: 20px; }
        .auth-card { background: var(--card); padding: 30px; border-radius: 16px; width: 100%; max-width: 340px; border: 1px solid var(--primary); text-align: center; }
        .auth-input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #475569; color: white; border-radius: 8px; text-align: center; }
        
        #main-app { display: none; flex-direction: column; height: 100%; }
        .header { background: #000; padding: 10px; text-align: center; border-bottom: 2px solid var(--card); font-family: monospace; font-size: 1.4rem; color: var(--accent); flex-shrink: 0; }
        .nav { display: flex; background: var(--card); flex-shrink: 0; }
        .nav-btn { flex: 1; padding: 15px 5px; border: none; background: none; color: #64748b; font-weight: bold; font-size: 0.9rem; border-bottom: 3px solid transparent; }
        .nav-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: rgba(255, 75, 92, 0.1); }
        
        .content { flex: 1; overflow-y: auto; padding: 15px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 12px; border: 1px solid #334155; }
        .title { font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
        
        .member-row { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 6px; border: 1px solid #475569; }
        .add-btn { background: var(--secondary); color: #000; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; }
        .remove-btn { background: #444; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-size: 0.7rem; }
        
        .footer { background: #000; border-top: 2px solid var(--primary); padding: 15px; flex-shrink: 0; }
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .action-btn { background: #334155; border: none; color: white; padding: 12px 5px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; }
        .action-btn.active { background: var(--primary); }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <h2>🛡️ 認証</h2>
        <input type="number" id="id-input" class="auth-input" placeholder="IDを入力">
        <button class="action-btn" style="width:100%; background:var(--primary);" onclick="processAuth()">ログイン</button>
    </div>
</div>

<div id="main-app">
    <div class="header" id="masterClock">00:00:00</div>
    <div class="nav">
        <button id="nav-run" class="nav-btn active" onclick="showTab('run')">⚡ 実行</button>
        <button id="nav-ally" class="nav-btn" onclick="showTab('ally')">👥 名簿選択</button>
        <button id="nav-settings" class="nav-btn" onclick="showTab('settings')">⚙️ 設定</button>
    </div>
    
    <div class="content">
        <div id="tab-run" class="tab-pane active">
            <div id="target-area"></div>
        </div>

        <div id="tab-ally" class="tab-pane">
            <div class="title">🏃 作戦参加メンバー (最上部はあなた)</div>
            <div id="active-list" style="margin-bottom:20px;"></div>
            
            <hr style="border:0; border-top:1px solid #475569; margin:20px 0;">
            
            <div class="title">➕ メンバーを追加</div>
            <div id="master-selection-list"></div>
        </div>

        <div id="tab-settings" class="tab-pane">
            <button class="action-btn" style="width:100%; background:#444;" onclick="localStorage.clear();location.reload();">ログアウト・初期化</button>
        </div>
    </div>

    <div class="footer">
        <div class="btn-grid">
            <button class="action-btn" id="rally-0" onclick="updateRally(0)">単騎</button>
            <button class="action-btn" id="rally-1" onclick="updateRally(1)">1分集結</button>
            <button class="action-btn" id="rally-5" onclick="updateRally(5)">5分集結</button>
        </div>
    </div>
</div>

<script>
    const MEMBER_MASTER = [
        {id:"493212867", name:"ボンド"}, {id:"492059189", name:"スミスミ"}, {id:"491154948", name:"NOBU"}, 
        {id:"491133240", name:"ユフィ"}, {id:"492271392", name:"スランバー"}, {id:"492055360", name:"Do_rucy"}, 
        {id:"492822360", name:"うめきち"}, {id:"491527765", name:"れふく"}, {id:"490876270", name:"うどん"},
        {id:"529236482", name:"テラフレート"}, {id:"490839848", name:"モモマイ"}, {id:"492658594", name:"アコー"},
        {id:"492132013", name:"ヤマダタロウ"}, {id:"491137229", name:"久利生公平"}, {id:"493706541", name:"Arya"},
        {id:"490759416", name:"guro"}, {id:"493861396", name:"なーっ"}, {id:"492547880", name:"miha25"},
        {id:"494362543", name:"muta"}, {id:"491563333", name:"かねやん"}, {id:"492842337", name:"Alonso"},
        {id:"491787053", name:"ちゃら男"}, {id:"493183277", name:"こーちゃん"}, {id:"493645404", name:"ヘロヘロ"},
        {id:"494203981", name:"wonsang007"}, {id:"491300814", name:"大Beat帝国"}, {id:"497820788", name:"Ferdinand"},
        {id:"492164518", name:"おこおこ"}, {id:"615629018", name:"ヒルチャール"}
    ];

    let state = JSON.parse(localStorage.getItem('wos_v6')) || {
        activeMembers: [], 
        enemy: { name: "ターゲット1", remain: 300 }
    };

    function save() { localStorage.setItem('wos_v6', JSON.stringify(state)); }

    function showTab(t) {
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + t).classList.add('active');
        document.getElementById('nav-' + t).classList.add('active');
    }

    function processAuth() {
        const id = document.getElementById('id-input').value.trim();
        const m = MEMBER_MASTER.find(x => x.id === id);
        if (m) {
            localStorage.setItem('wos_id', id);
            localStorage.setItem('wos_name', m.name);
            // ログイン時、自分を自動的に参加リストの先頭に追加
            if (!state.activeMembers.find(x => x.id === id)) {
                state.activeMembers.unshift({ ...m, time: 30, rally: 0 });
                save();
            }
            location.reload();
        } else { alert("IDが違います"); }
    }

    function addMember(id) {
        if (!state.activeMembers.find(m => m.id === id)) {
            const m = MEMBER_MASTER.find(x => x.id === id);
            state.activeMembers.push({ ...m, time: 30, rally: 0 });
            save();
            render();
        }
    }

    function removeMember(id) {
        // 自分自身は削除できないように設定（常に最上部に表示するため）
        const sid = localStorage.getItem('wos_id');
        if (id === sid) {
            alert("自分自身はリストから削除できません");
            return;
        }
        state.activeMembers = state.activeMembers.filter(m => m.id !== id);
        save();
        render();
    }

    function render() {
        const sid = localStorage.getItem('wos_id');
        if(!sid) return;

        // ターゲット表示
        document.getElementById('target-area').innerHTML = `
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <b>${state.enemy.name}</b>
                    <b style="font-size:2rem; color:var(--warning);" id="time-display">0:00</b>
                </div>
                <div class="btn-grid" style="margin-top:15px;">
                    <button class="action-btn" onclick="state.enemy.remain+=60;save();">+1分</button>
                    <button class="action-btn" onclick="state.enemy.remain+=1;save();">+1s</button>
                    <button class="action-btn" onclick="state.enemy.remain-=1;save();">-1s</button>
                </div>
            </div>`;

        // 参加中リスト（自分は「削除」ボタンを表示しない）
        document.getElementById('active-list').innerHTML = state.activeMembers.map((m, i) => `
            <div class="member-row" style="${m.id === sid ? 'border: 1px solid var(--accent); background: rgba(74, 222, 128, 0.1);' : ''}">
                <span><b>${m.name}${m.id === sid ? ' (あなた)' : ''}</b></span>
                <div style="display:flex; align-items:center; gap:10px;">
                    <input type="number" style="width:60px; height:35px; background:#000; color:#fff; border:1px solid #4ade80; text-align:center; border-radius:4px;" 
                        value="${m.time}" oninput="state.activeMembers[${i}].time=Number(this.value);save();">
                    ${m.id !== sid ? `<button class="remove-btn" onclick="removeMember('${m.id}')">削除</button>` : ''}
                </div>
            </div>`).join('');

        // 選択用リスト（自分自身は表示しない）
        document.getElementById('master-selection-list').innerHTML = MEMBER_MASTER
            .filter(m => m.id !== sid)
            .map(m => `
                <div class="member-row" style="background:none;">
                    <span>${m.name}</span>
                    <button class="add-btn" onclick="addMember('${m.id}')">参加</button>
                </div>`).join('');
            
        const my = state.activeMembers.find(m => m.id === sid);
        [0,1,5].forEach(r => {
            const btn = document.getElementById('rally-'+r);
            if(btn) btn.classList.toggle('active', my && my.rally === r);
        });
    }

    function updateRally(r) {
        const sid = localStorage.getItem('wos_id');
        const m = state.activeMembers.find(x => x.id === sid);
        if(m) { m.rally = r; save(); render(); }
    }

    window.onload = () => {
        const sid = localStorage.getItem('wos_id');
        if (!sid) document.getElementById('auth-screen').style.display = 'flex';
        else {
            // 初回ログイン時、万が一自分がいなければ追加
            if (!state.activeMembers.find(x => x.id === sid)) {
                const me = MEMBER_MASTER.find(x => x.id === sid);
                if(me) state.activeMembers.unshift({ ...me, time: 30, rally: 0 });
                save();
            }
            document.getElementById('main-app').style.display = 'flex';
            render();
            setInterval(() => {
                if(state.enemy.remain > 0) state.enemy.remain--;
                document.getElementById('masterClock').innerText = new Date().toLocaleTimeString('ja-JP',{hour12:false});
                const td = document.getElementById('time-display');
                if(td) td.innerText = Math.floor(state.enemy.remain/60) + ":" + (state.enemy.remain%60).toString().padStart(2,'0');
            }, 1000);
        }
    };
</script>
</body>
</html>
