<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOS Commander - Ultimate Edition</title>
    <style>
        :root { --primary: #ff4b5c; --secondary: #00d2ff; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #4ade80; --warning: #ffeb3b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: pan-y; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* 認証・ロック画面 */
        #auth-screen, #lock-screen { position: fixed; inset: 0; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: var(--bg); }
        #lock-screen { background: #000; z-index: 10000; text-align: center; }
        .auth-card { background: var(--card); padding: 30px; border-radius: 16px; width: 100%; max-width: 340px; border: 1px solid var(--primary); text-align: center; }
        .auth-input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #475569; color: white; border-radius: 8px; text-align: center; font-size: 1rem; }
        .auth-btn { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; width: 100%; }
        #auth-error { color: var(--primary); font-size: 0.8rem; margin-top: 10px; display: none; }

        /* メインアプリ構造 */
        #main-app { display: none; flex-direction: column; height: 100vh; }
        .header { background: #000; padding: 10px; text-align: center; border-bottom: 2px solid var(--card); }
        .clock { font-family: monospace; font-size: 1.5rem; color: var(--accent); font-weight: bold; }
        .nav { display: flex; background: var(--card); }
        .nav-btn { flex: 1; padding: 15px 5px; border: none; background: none; color: #64748b; font-weight: bold; font-size: 0.8rem; border-bottom: 3px solid transparent; }
        .nav-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: rgba(255, 75, 92, 0.1); }
        .content { flex: 1; overflow-y: auto; padding: 10px; padding-bottom: 280px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        
        /* カード & UI要素 */
        .card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid #334155; position: relative; }
        .title { font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px; font-weight: bold; }
        .drag-handle { width: 100%; height: 20px; background: rgba(255,255,255,0.05); cursor: grab; border-radius: 4px; margin-bottom: 5px; display: flex; justify-content: center; align-items: center; font-size: 0.6rem; color: #475569; }
        .drag-handle::after { content: ":::: Drag ::::"; }
        .dragging { opacity: 0.4; border: 2px dashed var(--primary); }
        
        /* タイマー・ターゲット */
        .target-accordion { margin-bottom: 12px; border-radius: 8px; overflow: hidden; border: 1px solid #475569; }
        .target-head { background: #1e293b; padding: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .target-head.active { background: var(--primary); }
        .timer-label { font-family: monospace; font-weight: bold; font-size: 1.2rem; }
        .target-body { display: none; background: #0f172a; padding: 10px; }
        .target-body.open { display: block; }
        
        /* ボタン・入力 */
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .action-btn { background: #334155; border: none; color: white; padding: 10px 4px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .action-btn.active { background: var(--primary); }
        .footer { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 2px solid var(--primary); padding: 10px; z-index: 100; }
        .copy-all { width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--primary); color: white; font-weight: bold; font-size: 1rem; margin-top: 8px; }
        .countdown-badge { font-family: monospace; font-size: 1.1rem; color: var(--warning); font-weight: bold; }
        .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #334155; }
        .mini-num { width: 45px; background: #000; border: 1px solid #475569; color: white; text-align: center; border-radius: 4px; }
    </style>
</head>
<body>

<div id="lock-screen">
    <h1 style="color:red; font-size:2.5rem;">🚫 ACCESS DENIED</h1>
    <p>別の端末でログインがあったか、許可されていません。</p>
    <button class="auth-btn" style="background:#444; width:auto; padding:10px 20px;" onclick="localStorage.clear();location.reload();">再ログイン</button>
</div>

<div id="auth-screen">
    <div class="auth-card">
        <h2 style="margin-bottom:20px;">🛡️ メンバー認証</h2>
        <input type="number" id="id-input" class="auth-input" placeholder="ゲーム内ID(9桁)">
        <input type="password" id="key-input" class="auth-input" placeholder="専用キー">
        <button class="auth-btn" onclick="processAuth()">ログイン</button>
        <p id="auth-error"></p>
    </div>
</div>

<div id="main-app">
    <div class="header"><div class="clock" id="masterClock">00:00:00</div></div>
    <div class="nav">
        <button class="nav-btn active" onclick="showTab('run')">⚡ 実行</button>
        <button class="nav-btn" onclick="showTab('ally')">👥 名簿</button>
        <button class="nav-btn" onclick="showTab('settings')">⚙️ 設定</button>
    </div>
    <div class="content">
        <div id="tab-run" class="tab-pane active" ondragover="handleDragOver(event)">
            <div class="card"><div class="title">目的地を選択</div><div class="btn-grid" id="dest-btns"></div></div>
            <div id="target-list-area"></div>
        </div>
        <div id="tab-ally" class="tab-pane">
            <div style="font-size:0.7rem; margin-bottom:10px;">ログイン中: <b id="user-info" style="color:var(--accent)"></b></div>
            <div class="title">👥 味方リスト</div>
            <div id="member-edit-list" ondragover="handleDragOver(event)"></div>
            <div class="title">👿 敵ターゲット</div>
            <div id="enemy-edit-list" ondragover="handleDragOver(event)"></div>
            <button class="action-btn" style="width:100%; background:var(--secondary);" onclick="addEnemy()">＋ ターゲット追加</button>
        </div>
        <div id="tab-settings" class="tab-pane">
            <div class="card"><div class="title">目的地管理</div><div id="dest-edit-list"></div></div>
            <button class="copy-all" style="background:#444;" onclick="if(confirm('ログアウトしますか？')){localStorage.clear();location.reload();}">ログアウト</button>
        </div>
    </div>
    <div class="footer">
        <div id="footer-count" style="color:var(--warning); text-align:center; font-weight:bold; margin-bottom:5px;">--</div>
        <div class="btn-grid">
            <button class="action-btn" id="my-r0" onclick="setMyRally(0)">単騎</button>
            <button class="action-btn" id="my-r1" onclick="setMyRally(1)">1分</button>
            <button class="action-btn" id="my-r5" onclick="setMyRally(5)">5分</button>
        </div>
        <button class="copy-all" onclick="copyInstructions()">📋 指示を一括コピー</button>
    </div>
</div>

<script>
    const DISCORD_URL = "https://discord.com/api/webhooks/1457262608020144316/5fAwUFmuZOcJLo4CDUGGbgmBpF8MZO6UsYdECuh_WxRIz6fXLxXcUokOcz69P1Ss4mxs";
    
    // メンバーDB
    const MEMBER_DB = {
        "492822360": { name: "うめきち", key: "u8k2h260" },
        "493212867": { name: "ボンド", key: "b3d2i867" },
        "492059189": { name: "スミスミ", key: "s2m5i189" },
        "491154948": { name: "NOBU", key: "n1b5u948" },
        "491133240": { name: "ユフィ", key: "y1f3u240" },
        "492271392": { name: "スランバー", key: "s2u7a392" },
        "492055360": { name: "Do_rucy", key: "d0r5u360" },
        "491527765": { name: "れふく", key: "r1f2u765" },
        "490876270": { name: "うどん", key: "u0d7o270" },
        "529236482": { name: "テラフレート", key: "t2r3f482" },
        "490839848": { name: "モモマイ", key: "m0m3a848" },
        "492658594": { name: "アコー", key: "a2o5u594" },
        "492132013": { name: "ヤマダタロウ", key: "y2m1a013" },
        "491137229": { name: "久利生公平", key: "k1u3u229" },
        "493706541": { name: "Arya", key: "a3y0a541" },
        "490759416": { name: "guro", key: "g0r5u416" },
        "493861396": { name: "なーっ", key: "n3a8a396" },
        "492547880": { name: "miha25", key: "m2h5a880" },
        "494362543": { name: "muta", key: "m4t3a543" },
        "491563333": { name: "かねやん", key: "k1n6y333" },
        "492842337": { name: "Alonso", key: "a2o4u337" },
        "491787053": { name: "ちゃら男", key: "c1a8o053" },
        "493183277": { name: "こーちゃん", key: "k3o8c277" },
        "493645404": { name: "ヘロヘロ", key: "h3l6a404" },
        "494203981": { name: "wonsang007", key: "w4s9n981" },
        "491300814": { name: "大Beat帝国", key: "d1b0t814" },
        "497820788": { name: "Ferdinand", key: "f7r2d788" },
        "492164518": { name: "おこおこ", key: "o2o6o518" },
        "615629018": { name: "ヒルチャール", key: "h1c2u018" }
    };

    // アプリ状態
    let state = {
        destIdx: 0, targetIdx: 0, destinations: ["王城"], 
        members: [], enemies: []
    };

    const getFP = () => btoa(navigator.userAgent + screen.width).slice(-8);

    function processAuth() {
        const id = document.getElementById('id-input').value.trim();
        const key = document.getElementById('key-input').value.trim();
        const m = MEMBER_DB[id];
        if (m && m.key === key) {
            localStorage.setItem('wos_id', id);
            localStorage.setItem('wos_name', m.name);
            localStorage.setItem('wos_fp', getFP());
            fetch(DISCORD_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({content:`🆕 **Login:** ${m.name} (ID:${id}) [FP:${getFP()}]`})});
            location.reload();
        } else {
            const err = document.getElementById('auth-error');
            err.innerText = "認証失敗"; err.style.display = "block";
        }
    }

    function save() { localStorage.setItem('wos_app_data_v1', JSON.stringify(state)); }
    function load() { 
        const s = localStorage.getItem('wos_app_data_v1'); 
        if(s) state = JSON.parse(s);
        // 初回ロード時にDBから全メンバーをインポート
        if(state.members.length === 0) {
            Object.keys(MEMBER_DB).forEach(id => {
                state.members.push({ id: id, name: MEMBER_DB[id].name, role:'member', times:[15], active:[true], rally:1 });
            });
            save();
        }
    }

    function render() {
        const sid = localStorage.getItem('wos_id');
        document.getElementById('user-info').innerText = `${localStorage.getItem('wos_name')} (ID:${sid})`;
        
        // 目的地
        document.getElementById('dest-btns').innerHTML = state.destinations.map((d, i) => `<button class="action-btn ${state.destIdx===i?'active':''}" onclick="state.destIdx=${i};save();render();">${d}</button>`).join('');
        
        // ターゲット
        document.getElementById('target-list-area').innerHTML = state.enemies.map((e, i) => `
            <div class="target-accordion" draggable="true" data-id="${e.id}" ondragstart="handleDragStart(event, ${e.id})">
                <div class="target-head ${state.targetIdx===i?'active':''}" onclick="state.targetIdx=${i};save();render();">
                    <span><b>${e.name}</b></span>
                    <span class="timer-label" id="timer-${i}">0:00</span>
                </div>
                <div class="target-body ${state.targetIdx===i?'open':''}">
                    <div class="btn-grid" style="margin-bottom:10px;">
                        <button class="action-btn" onclick="adjE(${i}, 60)">+1分</button>
                        <button class="action-btn" onclick="adjE(${i}, 1)">+1s</button>
                        <button class="action-btn" onclick="adjE(${i}, -1)">-1s</button>
                    </div>
                    <div id="countdown-list-${i}"></div>
                </div>
            </div>`).join('');

        renderAllyList();
        renderEnemyList();
    }

    function renderAllyList() {
        document.getElementById('member-edit-list').innerHTML = state.members.map((m, i) => `
            <div class="card" draggable="true" data-id="${m.id}" ondragstart="handleDragStart(event, ${m.id})">
                <div class="drag-handle"></div>
                <b>${m.name}</b>
                <div class="row">
                    <button class="action-btn ${m.role==='leader'?'active':''}" onclick="state.members[${i}].role='leader';save();render();">リーダー</button>
                    <div class="time-input-group">
                        <input type="number" class="mini-num" value="${Math.floor(m.times[state.destIdx]/60)}" onchange="updateMTime(${i}, this.value, true)">分
                        <input type="number" class="mini-num" value="${m.times[state.destIdx]%60}" onchange="updateMTime(${i}, this.value, false)">秒
                    </div>
                    <input type="checkbox" ${m.active[state.destIdx]?'checked':''} onchange="state.members[${i}].active[state.destIdx]=this.checked;save();">
                </div>
            </div>`).join('');
    }

    function renderEnemyList() {
        document.getElementById('enemy-edit-list').innerHTML = state.enemies.map((e, i) => `
            <div class="card" data-id="${e.id}">
                <input type="text" value="${e.name}" onchange="state.enemies[${i}].name=this.value;save();">
                <button class="action-btn" style="margin-top:5px; background:#950740" onclick="state.enemies.splice(${i},1);save();render();">削除</button>
            </div>`).join('');
    }

    function updateMTime(idx, val, isMin) {
        let t = state.members[idx].times[state.destIdx];
        if(isMin) t = (parseInt(val)||0)*60 + (t%60);
        else t = Math.floor(t/60)*60 + (parseInt(val)||0);
        state.members[idx].times[state.destIdx] = t;
        save();
    }

    function adjE(i, s) { state.enemies[i].remain += s; save(); }
    function setMyRally(r) { 
        const sid = localStorage.getItem('wos_id');
        const m = state.members.find(x => x.id === sid);
        if(m) { m.rally = r; save(); render(); }
    }

    function addEnemy() { state.enemies.push({ id: Date.now(), name: "ターゲット", times: state.destinations.map(()=>20), remain: 300 }); save(); render(); }
    function showTab(t) { document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active')); document.getElementById('tab-'+t).classList.add('active'); }

    // ドラッグ＆ドロップ
    let dragId = null;
    function handleDragStart(e, id) { dragId = id; e.target.classList.add('dragging'); }
    function handleDragOver(e) { e.preventDefault(); }
    // (簡易ソート機能はリストの再配置が必要なため、今回は構造維持を優先)

    // ループ
    setInterval(() => {
        const now = Date.now();
        document.getElementById('masterClock').innerText = new Date().toLocaleTimeString('ja-JP', {hour12:false});
        
        state.enemies.forEach((e, i) => {
            e.remain--;
            const el = document.getElementById('timer-'+i);
            if(el) el.innerText = Math.floor(Math.max(0, e.remain)/60) + ":" + (Math.max(0,e.remain)%60).toString().padStart(2,'0');
            
            if(state.targetIdx === i) {
                const list = document.getElementById('countdown-list-'+i);
                const tDate = now + (e.remain + e.times[state.destIdx])*1000;
                list.innerHTML = state.members.map(m => {
                    if(!m.active[state.destIdx]) return '';
                    const start = Math.floor((tDate - now - m.times[state.destIdx]*1000)/1000);
                    return `<div class="row"><span>${m.name}</span><span class="countdown-badge">${start>0?'あと'+start+'秒':'出発！'}</span></div>`;
                }).join('');
            }
        });
    }, 1000);

    window.onload = () => {
        if(!localStorage.getItem('wos_id')) document.getElementById('auth-screen').style.display='flex';
        else {
            document.getElementById('main-app').style.display='flex';
            load();
            render();
        }
    };

    function copyInstructions() {
        const e = state.enemies[state.targetIdx];
        const now = new Date();
        let txt = `【${state.destinations[state.destIdx]} 👿${e.name}】\n`;
        state.members.forEach(m => {
            if(m.active[state.destIdx]) {
                const s = new Date(Date.now() + (e.remain + e.times[state.destIdx] - m.times[state.destIdx] - (m.role==='leader'?m.rally*60:0))*1000);
                txt += `${m.name} ${m.role==='leader'?'集結'+m.rally+'分':'単騎'} ${s.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}\n`;
            }
        });
        navigator.clipboard.writeText(txt); alert("指示をコピーしました");
    }
</script>
</body>
</html>
