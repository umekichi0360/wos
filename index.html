<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOS Commander Pro - Ultra Secure</title>
    <style>
        :root { --primary: #ff4b5c; --secondary: #00d2ff; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #4ade80; --warning: #ffeb3b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; height: 100dvh; display: flex; flex-direction: column; }
        
        /* 通信・認証用画面 */
        #error-screen, #auth-screen { position: fixed; inset: 0; z-index: 10000; display: none; background: var(--bg); flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .auth-card { background: var(--card); padding: 30px; border-radius: 16px; width: 100%; max-width: 340px; border: 1px solid var(--primary); }
        .auth-input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #475569; color: white; border-radius: 8px; text-align: center; }
        
        /* メインレイアウト */
        #main-app { display: none; flex-direction: column; height: 100%; }
        .header { background: #000; padding: 10px; text-align: center; border-bottom: 2px solid var(--card); font-family: monospace; font-size: 1.4rem; color: var(--accent); flex-shrink: 0; }
        .nav { display: flex; background: var(--card); flex-shrink: 0; }
        .nav-btn { flex: 1; padding: 15px 5px; border: none; background: none; color: #64748b; font-weight: bold; font-size: 0.9rem; border-bottom: 3px solid transparent; }
        .nav-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: rgba(255, 75, 92, 0.1); }
        
        .content { flex: 1; overflow-y: auto; padding: 15px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 12px; border: 1px solid #334155; }
        .title { font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
        
        /* メンバー・リスト用 */
        .dest-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; }
        .member-row { display: flex; flex-direction: column; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 12px; border: 1px solid #475569; }
        .dest-time-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .time-ctrl { display: flex; align-items: center; gap: 4px; background: #000; padding: 2px; border-radius: 6px; }
        .step-btn { background: #334155; color: white; border: none; width: 28px; height: 28px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .time-val { width: 45px; text-align: center; font-weight: bold; color: var(--accent); }

        .add-btn { background: var(--secondary); color: #000; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .remove-btn { background: #444; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; }
        
        .footer { background: #000; border-top: 2px solid var(--primary); padding: 15px; flex-shrink: 0; }
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .action-btn { background: #334155; border: none; color: white; padding: 12px 5px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        .action-btn.active { background: var(--primary); }
        select { background: #000; color: #fff; padding: 10px; border: 1px solid #475569; border-radius: 4px; width: 100%; margin-bottom: 10px; font-size: 1rem; }
    </style>
</head>
<body>

<div id="error-screen">
    <div style="font-size:3rem; margin-bottom:15px;">🌐</div>
    <h3>通信エラー</h3>
    <p>正確な時刻を同期できません。<br>オンライン（HTTPS）で再起動してください。</p>
    <button class="add-btn" onclick="location.reload()">再試行</button>
</div>

<div id="auth-screen">
    <div class="auth-card">
        <h2>🛡️ 認証</h2>
        <input type="number" id="id-input" class="auth-input" placeholder="ID">
        <input type="password" id="key-input" class="auth-input" placeholder="専用キー">
        <div style="margin: 10px 0; font-size: 0.8rem; color: #94a3b8;">
            <input type="checkbox" id="save-me"> <label for="save-me">IDとキーを保存する</label>
        </div>
        <button class="action-btn" style="width:100%; background:var(--primary); margin-top:10px;" onclick="processAuth()">ログイン</button>
    </div>
</div>

<div id="main-app">
    <div class="header" id="masterClock">--:--:--</div>
    <div class="nav">
        <button id="nav-run" class="nav-btn active" onclick="showTab('run')">⚡ 実行</button>
        <button id="nav-ally" class="nav-btn" onclick="showTab('ally')">👥 名簿選択</button>
        <button id="nav-settings" class="nav-btn" onclick="showTab('settings')">⚙️ 設定</button>
    </div>
    
    <div class="content">
        <div id="tab-run" class="tab-pane active">
            <div class="card"><div class="title">目的地切り替え</div><div id="dest-btns" class="dest-grid"></div></div>
            <div id="target-area"></div>
            <button id="pip-btn" class="action-btn" style="width:100%; background:var(--secondary); color:#000; margin-top:10px; display:none;">📺 カウントダウンを小窓で表示</button>
            <canvas id="pip-canvas" width="300" height="150" style="display:none;"></canvas>
            <video id="pip-video" autoplay muted playsinline style="display:none;"></video>
        </div>

        <div id="tab-ally" class="tab-pane">
            <div class="title">🏃 参加中のメンバー</div>
            <div id="active-list"></div>
            <hr style="border:0; border-top:1px solid #475569; margin:20px 0;">
            <div class="title">➕ メンバーを追加 (ボンド～順)</div>
            <div id="master-selection-list"></div>
        </div>

        <div id="tab-settings" class="tab-pane">
            <div class="card">
                <div class="title">目的地の追加</div>
                <select id="dest-type" onchange="toggleDestNumbers()">
                    <option value="王城">王城</option>
                    <option value="砦">砦</option>
                    <option value="要塞">要塞</option>
                </select>
                <div id="number-select-area" style="display:none;"><select id="dest-number"></select></div>
                <button class="add-btn" style="width:100%;" onclick="addDest()">この場所を追加</button>
            </div>
            <div class="card"><div class="title">場所の管理</div><div id="dest-manage-list"></div></div>
            <button class="action-btn" style="width:100%; background:#444; margin-top:20px;" onclick="logout()">ログアウト</button>
        </div>
    </div>

    <div class="footer">
        <div class="btn-grid">
            <button class="action-btn" id="rally-0" onclick="updateRally(0)">単騎</button>
            <button class="action-btn" id="rally-1" onclick="updateRally(1)">1分集結</button>
            <button class="action-btn" id="rally-5" onclick="updateRally(5)">5分集結</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'wos_v20';
    const STORAGE_KEY_AUTH = 'wos_auth_save';
    const ORDERED_MEMBER_IDS = ["493212867","492059189","491154948","491133240","492271392","492055360","491527765","492822360","490876270","529236482","490839848","492658594","492132013","491137229","493706541","490759416","493861396","492547880","494362543","491563333","492842337","491787053","493183277","493645404","494203981","491300814","497820788","492164518","615629018"];
    const MEMBER_DB = {"493212867":{name:"ボンド",key:"b3d2i867"},"492059189":{name:"スミスミ",key:"s2m5i189"},"491154948":{name:"NOBU",key:"n1b5u948"},"491133240":{name:"ユフィ",key:"y1f3u240"},"492271392":{name:"スランバー",key:"s2u7a392"},"492055360":{name:"Do_rucy",key:"d0r5u360"},"491527765":{name:"れふく",key:"r1f2u765"},"492822360":{name:"うめきち",key:"u8k2h260"},"490876270":{name:"うどん",key:"udo270"},"529236482":{name:"テラフレート",key:"t2r3f482"},"490839848":{name:"モモマイ",key:"m0m3a848"},"492658594":{name:"アコー",key:"ako594"},"492132013":{name:"ヤマダタロウ",key:"yam013"},"491137229":{name:"久利生公平",key:"kur229"},"493706541":{name:"Arya",key:"ary541"},"490759416":{name:"guro",key:"gur416"},"493861396":{name:"なーっ",key:"naa396"},"492547880":{name:"miha25",key:"mih880"},"494362543":{name:"muta", key:"mut543"},"491563333":{name:"かねやん",key:"kan333"},"492842337":{name:"Alonso",key:"alo337"},"491787053":{name:"ちゃら男",key:"cha053"},"493183277":{name:"こーちゃん",key:"koo277"},"493645404":{name:"ヘロヘロ",key:"h3l6a404"},"494203981":{name:"wonsang007",key:"won981"},"491300814":{name:"大Beat帝国",key:"dai814"},"497820788":{name:"Ferdinand",key:"fer788"},"492164518":{name:"おこおこ",key:"oko518"},"615629018":{name:"ヒルチャール",key:"hir018"}};

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { currentDestIdx: 0, destinations: [{ name: "王城", memberTimes: {}, memberLocked: {} }], activeMemberIds: [], enemyRemain: 300 };
    let timeOffset = 0;

    async function syncTime() {
        try {
            const start = Date.now();
            const response = await fetch('https://worldtimeapi.org/api/timezone/Asia/Tokyo');
            if (!response.ok) throw new Error();
            const data = await response.json();
            timeOffset = (new Date(data.datetime).getTime() + ((Date.now() - start)/2)) - Date.now();
            return true;
        } catch (e) { return false; }
    }

    function getNow() { return new Date(Date.now() + timeOffset); }
    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    
    function logout(reason) {
        if(reason) alert(reason);
        const auth = localStorage.getItem(STORAGE_KEY_AUTH);
        localStorage.clear();
        if(auth) localStorage.setItem(STORAGE_KEY_AUTH, auth);
        location.reload();
    }

    // --- メイン描画 ---
    function render() {
        const sid = localStorage.getItem('wos_id');
        if(!sid || !MEMBER_DB[sid]) return;

        // 目的地切替
        document.getElementById('dest-btns').innerHTML = state.destinations.map((d, i) => `<button class="action-btn ${state.currentDestIdx === i ? 'active' : ''}" onclick="state.currentDestIdx=${i};save();render();">${d.name}</button>`).join('');
        const currentDest = state.destinations[state.currentDestIdx];
        document.getElementById('target-area').innerHTML = `<div class="card"><div style="display:flex; justify-content:space-between; align-items:center;"><b>${currentDest.name}</b><b style="font-size:2.4rem; color:var(--warning); font-family:monospace;" id="time-display">0:00</b></div></div>`;

        // 名簿タブ
        const displayActiveIds = state.activeMemberIds.slice().sort((a, b) => (a===sid?-1:b===sid?1:ORDERED_MEMBER_IDS.indexOf(a)-ORDERED_MEMBER_IDS.indexOf(b)));
        document.getElementById('active-list').innerHTML = displayActiveIds.map(mid => `
            <div class="member-row" style="${mid === sid ? 'border-left:4px solid var(--accent);' : ''}">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <b>${MEMBER_DB[mid].name}${mid === sid ? ' (自分)' : ''}</b>
                    ${mid !== sid ? `<button class="remove-btn" onclick="state.activeMemberIds=state.activeMemberIds.filter(id=>id!=='${mid}');save();render();">×</button>` : ''}
                </div>
                ${state.destinations.map((dest, dIdx) => `
                    <div class="dest-time-item">
                        <span style="font-size:0.8rem">${dest.name}</span>
                        <div class="time-ctrl">
                            <button class="step-btn" onclick="updateTime('${mid}', ${dIdx}, -1)">-</button>
                            <div class="time-val">${(dest.memberTimes[mid] || 15)}s</div>
                            <button class="step-btn" onclick="updateTime('${mid}', ${dIdx}, 1)">+</button>
                        </div>
                    </div>`).join('')}
            </div>`).join('');
        
        document.getElementById('master-selection-list').innerHTML = ORDERED_MEMBER_IDS.filter(id => !state.activeMemberIds.includes(id)).map(id => `
            <div class="member-row" style="flex-direction:row; justify-content:space-between; align-items:center; background:none; border:1px solid #334155;">
                <span>${MEMBER_DB[id].name}</span>
                <button class="add-btn" onclick="state.activeMemberIds.push('${id}');save();render();">参加</button>
            </div>`).join('');

        // 設定タブ：場所管理
        document.getElementById('dest-manage-list').innerHTML = state.destinations.map((d, i) => `
            <div class="member-row" style="flex-direction:row; justify-content:space-between;">
                <span>${d.name}</span>
                <button class="remove-btn" onclick="if(confirm('削除しますか？')){state.destinations.splice(${i},1);state.currentDestIdx=0;save();render();}">削除</button>
            </div>`).join('');
        
        // PiPボタン表示
        const pipBtn = document.getElementById('pip-btn');
        if (document.pictureInPictureEnabled || document.createElement('video').webkitSupportsPresentationMode) {
            pipBtn.style.display = 'block';
            pipBtn.onclick = startPiP;
        }
    }

    function updateTime(mid, dIdx, delta) {
        if(!state.destinations[dIdx].memberTimes) state.destinations[dIdx].memberTimes = {};
        state.destinations[dIdx].memberTimes[mid] = Math.max(0, (state.destinations[dIdx].memberTimes[mid] || 15) + delta);
        save(); render();
    }

    function toggleDestNumbers() {
        const type = document.getElementById('dest-type').value;
        const area = document.getElementById('number-select-area');
        const select = document.getElementById('dest-number');
        select.innerHTML = '';
        if (type !== '王城') {
            area.style.display = 'block';
            const max = type === '砦' ? 12 : 4;
            for(let i=1; i<=max; i++) select.innerHTML += `<option value="${i}">${i}号</option>`;
        } else { area.style.display = 'none'; }
    }

    function addDest() {
        const type = document.getElementById('dest-type').value;
        const num = document.getElementById('dest-number').value;
        const name = type === '王城' ? '王城' : num + '号' + type;
        state.destinations.push({ name: name, memberTimes: {}, memberLocked: {} });
        save(); render();
    }

    // --- 小窓（PiP）ロジック ---
    const pipCanvas = document.getElementById('pip-canvas');
    const pipVideo = document.getElementById('pip-video');
    const ctx = pipCanvas.getContext('2d');

    async function startPiP() {
        try {
            const stream = pipCanvas.captureStream(30); 
            pipVideo.srcObject = stream;
            pipVideo.muted = true;
            pipVideo.setAttribute('playsinline', '');
            await pipVideo.play();

            if (pipVideo.webkitSupportsPresentationMode && typeof pipVideo.webkitSetPresentationMode === "function") {
                await pipVideo.webkitSetPresentationMode("picture-in-picture");
            } else if (pipVideo.requestPictureInPicture) {
                await pipVideo.requestPictureInPicture();
            } else {
                throw new Error();
            }
        } catch (err) {
            alert("小窓表示に失敗しました。HTTPS環境（鍵マーク）であることを確認し、もう一度タップしてください。");
        }
    }

    function updatePipCanvas() {
        ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, 300, 150);
        const timeStr = Math.floor(state.enemyRemain/60) + ":" + (state.enemyRemain%60).toString().padStart(2,'0');
        ctx.fillStyle = '#ffeb3b'; ctx.font = 'bold 80px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(timeStr, 150, 75);
        requestAnimationFrame(updatePipCanvas);
    }

    // --- 認証・初期化 ---
    function processAuth() {
        const id = document.getElementById('id-input').value.trim();
        const key = document.getElementById('key-input').value.trim();
        const saveMe = document.getElementById('save-me').checked;
        if (MEMBER_DB[id] && MEMBER_DB[id].key === key) {
            localStorage.setItem('wos_id', id);
            if(saveMe) localStorage.setItem(STORAGE_KEY_AUTH, JSON.stringify({id, key}));
            else localStorage.removeItem(STORAGE_KEY_AUTH);
            location.reload();
        } else { alert("認証失敗"); }
    }

    function showTab(t) {
        document.querySelectorAll('.tab-pane, .nav-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + t).classList.add('active');
        document.getElementById('nav-' + t).classList.add('active');
        render();
    }

    window.onload = async () => {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_AUTH));
        if(saved) { document.getElementById('id-input').value = saved.id; document.getElementById('key-input').value = saved.key; document.getElementById('save-me').checked = true; }

        const isOnline = await syncTime();
        if (!isOnline) { document.getElementById('error-screen').style.display = 'flex'; return; }

        const sid = localStorage.getItem('wos_id');
        if (!sid) {
            document.getElementById('auth-screen').style.display = 'flex';
        } else {
            if(!MEMBER_DB[sid]) { logout(); return; }
            document.getElementById('main-app').style.display = 'flex';
            toggleDestNumbers(); render(); updatePipCanvas();
            
            setInterval(() => {
                if(state.enemyRemain > 0) state.enemyRemain--;
                document.getElementById('masterClock').innerText = getNow().toLocaleTimeString('ja-JP',{hour12:false});
                const td = document.getElementById('time-display');
                if(td) td.innerText = Math.floor(state.enemyRemain/60) + ":" + (state.enemyRemain%60).toString().padStart(2,'0');
            }, 1000);

            // 5分おきセキュリティ
            setInterval(async () => {
                const ok = await syncTime();
                if (!ok) { logout("通信切断のためログアウトしました。鍵マークの環境で再接続してください。"); return; }
                const cur = localStorage.getItem('wos_id');
                if (cur && !MEMBER_DB[cur]) logout("認証失効。");
            }, 300000);
        }
    };
</script>
</body>
</html>
