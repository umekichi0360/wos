<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOS Commander PRO</title>
    <style>
        :root { --primary: #ff4b5c; --secondary: #00d2ff; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #4ade80; --warning: #ffeb3b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; height: 100dvh; display: flex; flex-direction: column; }
        
        #auth-screen { position: fixed; inset: 0; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); padding: 20px; }
        .auth-card { background: var(--card); padding: 30px; border-radius: 16px; width: 100%; max-width: 340px; border: 1px solid var(--primary); text-align: center; }
        .auth-input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #475569; color: white; border-radius: 8px; text-align: center; }
        
        #main-app { display: none; flex-direction: column; height: 100%; }
        .header { background: #000; padding: 10px; text-align: center; border-bottom: 2px solid var(--card); font-family: monospace; font-size: 1.4rem; color: var(--accent); flex-shrink: 0; }
        .nav { display: flex; background: var(--card); flex-shrink: 0; }
        .nav-btn { flex: 1; padding: 15px 5px; border: none; background: none; color: #64748b; font-weight: bold; font-size: 0.9rem; border-bottom: 3px solid transparent; }
        .nav-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: rgba(255, 75, 92, 0.1); }
        
        .content { flex: 1; overflow-y: auto; padding: 15px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 12px; border: 1px solid #334155; }
        .title { font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
        
        .dest-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; }
        .member-row { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 6px; border: 1px solid #475569; }
        .add-btn { background: var(--secondary); color: #000; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; }
        .remove-btn { background: #444; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-size: 0.7rem; }
        
        .footer { background: #000; border-top: 2px solid var(--primary); padding: 15px; flex-shrink: 0; }
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .action-btn { background: #334155; border: none; color: white; padding: 12px 5px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; }
        .action-btn.active { background: var(--primary); }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <h2>🛡️ 認証</h2>
        <input type="number" id="id-input" class="auth-input" placeholder="ID">
        <input type="password" id="key-input" class="auth-input" placeholder="専用キー">
        <button class="action-btn" style="width:100%; background:var(--primary); margin-top:10px;" onclick="processAuth()">ログイン</button>
    </div>
</div>

<div id="main-app">
    <div class="header" id="masterClock">00:00:00</div>
    <div class="nav">
        <button id="nav-run" class="nav-btn active" onclick="showTab('run')">⚡ 実行</button>
        <button id="nav-ally" class="nav-btn" onclick="showTab('ally')">👥 名簿選択</button>
        <button id="nav-settings" class="nav-btn" onclick="showTab('settings')">⚙️ 設定</button>
    </div>
    
    <div class="content">
        <div id="tab-run" class="tab-pane active">
            <div class="card">
                <div class="title">目的地（場所切り替え）</div>
                <div id="dest-btns" class="dest-grid"></div>
            </div>
            <div id="target-area"></div>
        </div>

        <div id="tab-ally" class="tab-pane">
            <div class="card" style="border-left:4px solid var(--secondary);">
                <div class="title">現在編集中の場所</div>
                <b id="editing-dest-name" style="color:var(--secondary); font-size:1.2rem;">---</b>
            </div>
            <div class="title">🏃 作戦参加メンバー</div>
            <div id="active-list" style="margin-bottom:20px;"></div>
            <hr style="border:0; border-top:1px solid #475569; margin:20px 0;">
            <div class="title">➕ メンバーを追加</div>
            <div id="master-selection-list"></div>
        </div>

        <div id="tab-settings" class="tab-pane">
            <div class="card">
                <div class="title">目的地の追加</div>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="new-dest-name" style="flex:1; padding:10px; background:#000; border:1px solid #475569; color:#fff; border-radius:4px;" placeholder="場所名を入力">
                    <button class="add-btn" onclick="addDest()">追加</button>
                </div>
            </div>
            <div class="card">
                <div class="title">場所の削除</div>
                <div id="dest-manage-list"></div>
            </div>
            <button class="action-btn" style="width:100%; background:#444; margin-top:20px;" onclick="if(confirm('ログアウトしますか？')){localStorage.clear();location.reload();}">ログアウト</button>
        </div>
    </div>

    <div class="footer">
        <div class="btn-grid">
            <button class="action-btn" id="rally-0" onclick="updateRally(0)">単騎</button>
            <button class="action-btn" id="rally-1" onclick="updateRally(1)">1分集結</button>
            <button class="action-btn" id="rally-5" onclick="updateRally(5)">5分集結</button>
        </div>
    </div>
</div>

<script>
    const MEMBER_DB = {
        "493212867": { name: "ボンド", key: "b3d2i867" }, "492059189": { name: "スミスミ", key: "s2m5i189" },
        "491154948": { name: "NOBU", key: "n1b5u948" }, "491133240": { name: "ユフィ", key: "y1f3u240" },
        "492271392": { name: "スランバー", key: "s2u7a392" }, "492055360": { name: "Do_rucy", key: "d0r5u360" },
        "492822360": { name: "うめきち", key: "u8k2h260" }, "491527765": { name: "れふく", key: "r1f2u765" },
        "490876270": { name: "うどん", key: "udo270" }, "529236482": { name: "テラフレート", key: "t2r3f482" },
        "490839848": { name: "モモマイ", key: "m0m3a848" }, "492658594": { name: "アコー", key: "ako594" },
        "492132013": { name: "ヤマダタロウ", key: "yam013" }, "491137229": { name: "久利生公平", key: "kur229" },
        "493706541": { name: "Arya", key: "ary541" }, "490759416": { name: "guro", key: "gur416" },
        "493861396": { name: "なーっ", key: "naa396" }, "492547880": { name: "miha25", key: "mih880" },
        "494362543": { name: "muta", key: "mut543" }, "491563333": { name: "かねやん", key: "kan333" },
        "492842337": { name: "Alonso", key: "alo337" }, "491787053": { name: "ちゃら男", key: "cha053" },
        "493183277": { name: "こーちゃん", key: "koo277" }, "493645404": { name: "ヘロヘロ", key: "h3l6a404" },
        "494203981": { name: "wonsang007" }, "491300814": { name: "大Beat帝国" }, "497820788": { name: "Ferdinand" },
        "492164518": { name: "おこおこ" }, "615629018": { name: "ヒルチャール" }
    };

    let state = JSON.parse(localStorage.getItem('wos_v9')) || {
        currentDestIdx: 0,
        destinations: [{ name: "王城", memberTimes: {}, memberRally: {} }],
        activeMemberIds: [],
        enemyRemain: 300
    };

    function save() { localStorage.setItem('wos_v9', JSON.stringify(state)); }

    function showTab(t) {
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + t).classList.add('active');
        document.getElementById('nav-' + t).classList.add('active');
        render();
    }

    // ログイン処理を厳格化
    function processAuth() {
        const id = document.getElementById('id-input').value.trim();
        const key = document.getElementById('key-input').value.trim();
        
        if (MEMBER_DB[id]) {
            if (MEMBER_DB[id].key === key) {
                localStorage.setItem('wos_id', id);
                localStorage.setItem('wos_name', MEMBER_DB[id].name);
                location.reload();
            } else {
                alert("専用キーが正しくありません");
            }
        } else {
            alert("該当するIDが見つかりません");
        }
    }

    function addDest() {
        const name = document.getElementById('new-dest-name').value.trim();
        if (name) {
            state.destinations.push({ name: name, memberTimes: {}, memberRally: {} });
            document.getElementById('new-dest-name').value = '';
            save();
            render();
        }
    }

    function deleteDest(idx) {
        if (state.destinations.length <= 1) return alert("最後の場所は削除できません");
        if (confirm(`「${state.destinations[idx].name}」を削除しますか？`)) {
            state.destinations.splice(idx, 1);
            state.currentDestIdx = 0;
            save();
            render();
        }
    }

    function addMember(id) {
        if (!state.activeMemberIds.includes(id)) {
            state.activeMemberIds.push(id);
            save();
            render();
        }
    }

    function removeMember(id) {
        if (id === localStorage.getItem('wos_id')) return;
        state.activeMemberIds = state.activeMemberIds.filter(mid => mid !== id);
        save();
        render();
    }

    function render() {
        const sid = localStorage.getItem('wos_id');
        if(!sid) return;

        const currentDest = state.destinations[state.currentDestIdx];
        document.getElementById('editing-dest-name').innerText = currentDest.name;

        document.getElementById('dest-btns').innerHTML = state.destinations.map((d, i) => `
            <button class="action-btn ${state.currentDestIdx === i ? 'active' : ''}" onclick="state.currentDestIdx=${i};save();render();">${d.name}</button>
        `).join('');

        document.getElementById('target-area').innerHTML = `
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <b>${currentDest.name} カウント</b>
                    <b style="font-size:2rem; color:var(--warning);" id="time-display">0:00</b>
                </div>
                <div class="btn-grid" style="margin-top:15px;">
                    <button class="action-btn" onclick="state.enemyRemain+=60;save();">+1分</button>
                    <button class="action-btn" onclick="state.enemyRemain+=1;save();">+1s</button>
                    <button class="action-btn" onclick="state.enemyRemain-=1;save();">-1s</button>
                </div>
            </div>`;

        document.getElementById('active-list').innerHTML = state.activeMemberIds.map((mid) => {
            const m = MEMBER_DB[mid];
            if(!m) return '';
            const time = currentDest.memberTimes[mid] || 30;
            return `
            <div class="member-row" style="${mid === sid ? 'border: 1px solid var(--accent); background: rgba(74,222,128,0.1);' : ''}">
                <span><b>${m.name}</b></span>
                <div style="display:flex; align-items:center; gap:8px;">
                    <input type="number" style="width:55px; height:35px; background:#000; color:#fff; border:1px solid #4ade80; text-align:center;" 
                        value="${time}" oninput="state.destinations[${state.currentDestIdx}].memberTimes['${mid}']=Number(this.value);save();">
                    ${mid !== sid ? `<button class="remove-btn" onclick="removeMember('${mid}')">×</button>` : ''}
                </div>
            </div>`;
        }).join('');

        document.getElementById('master-selection-list').innerHTML = Object.keys(MEMBER_DB)
            .filter(id => !state.activeMemberIds.includes(id))
            .map(id => `
                <div class="member-row" style="background:none;">
                    <span>${MEMBER_DB[id].name}</span>
                    <button class="add-btn" onclick="addMember('${id}')">参加</button>
                </div>`).join('');

        document.getElementById('dest-manage-list').innerHTML = state.destinations.map((d, i) => `
            <div class="member-row">
                <span>${d.name}</span>
                <button class="remove-btn" onclick="deleteDest(${i})">削除</button>
            </div>
        `).join('');
            
        const myRally = (currentDest.memberRally && currentDest.memberRally[sid]) || 0;
        [0,1,5].forEach(r => {
            const btn = document.getElementById('rally-'+r);
            if(btn) btn.classList.toggle('active', myRally === r);
        });
    }

    function updateRally(r) {
        const sid = localStorage.getItem('wos_id');
        const currentDest = state.destinations[state.currentDestIdx];
        if (!currentDest.memberRally) currentDest.memberRally = {};
        currentDest.memberRally[sid] = r;
        save();
        render();
    }

    window.onload = () => {
        const sid = localStorage.getItem('wos_id');
        if (!sid) document.getElementById('auth-screen').style.display = 'flex';
        else {
            if (!state.activeMemberIds.includes(sid)) state.activeMemberIds.unshift(sid);
            document.getElementById('main-app').style.display = 'flex';
            render();
            setInterval(() => {
                if(state.enemyRemain > 0) state.enemyRemain--;
                document.getElementById('masterClock').innerText = new Date().toLocaleTimeString('ja-JP',{hour12:false});
                const td = document.getElementById('time-display');
                if(td) td.innerText = Math.floor(state.enemyRemain/60) + ":" + (state.enemyRemain%60).toString().padStart(2,'0');
            }, 1000);
        }
    };
</script>
</body>
</html>
