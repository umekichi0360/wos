<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOS Secure Commander</title>
    <style>
        :root { --primary: #ff4b5c; --secondary: #00d2ff; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #4ade80; --warning: #ffeb3b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* 認証・ロック */
        #auth-screen, #lock-screen { position: fixed; inset: 0; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: var(--bg); }
        .auth-card { background: var(--card); padding: 30px; border-radius: 16px; width: 100%; max-width: 340px; border: 1px solid var(--primary); text-align: center; }
        .auth-input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #475569; color: white; border-radius: 8px; text-align: center; font-size: 1rem; }
        .auth-btn { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        
        /* メインアプリ */
        #main-app { display: none; flex-direction: column; height: 100vh; }
        .header { background: #000; padding: 10px; text-align: center; border-bottom: 2px solid var(--card); }
        .clock { font-family: monospace; font-size: 1.5rem; color: var(--accent); font-weight: bold; }
        .nav { display: flex; background: var(--card); }
        .nav-btn { flex: 1; padding: 15px 5px; border: none; background: none; color: #64748b; font-weight: bold; font-size: 0.8rem; border-bottom: 3px solid transparent; }
        .nav-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: rgba(255, 75, 92, 0.1); }
        .content { flex: 1; overflow-y: auto; padding: 10px; padding-bottom: 200px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* カード・パーツ */
        .card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid #334155; }
        .title { font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px; font-weight: bold; }
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .action-btn { background: #334155; border: none; color: white; padding: 10px 4px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .action-btn.active { background: var(--primary); }
        .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #334155; }
        .mini-num { width: 45px; background: #000; border: 1px solid #475569; color: white; text-align: center; }

        /* フッター */
        .footer { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 2px solid var(--primary); padding: 10px; z-index: 100; }
        .copy-all { width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--primary); color: white; font-weight: bold; font-size: 1rem; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <h2>🛡️ 指揮官認証</h2>
        <input type="number" id="id-input" class="auth-input" placeholder="ID">
        <input type="password" id="key-input" class="auth-input" placeholder="キー">
        <button class="auth-btn" onclick="processAuth()">ログイン</button>
        <p id="auth-error" style="color:red; display:none;"></p>
    </div>
</div>

<div id="main-app">
    <div class="header"><div class="clock" id="masterClock">00:00:00</div></div>
    <div class="nav">
        <button id="btn-run" class="nav-btn active" onclick="showTab('run')">⚡ 実行</button>
        <button id="btn-ally" class="nav-btn" onclick="showTab('ally')">👥 名簿</button>
        <button id="btn-settings" class="nav-btn" onclick="showTab('settings')">⚙️ 設定</button>
    </div>
    <div class="content">
        <div id="tab-run" class="tab-pane active">
            <div class="card"><div class="title">目的地を選択</div><div class="btn-grid" id="dest-btns"></div></div>
            <div id="target-list-area"></div>
        </div>
        <div id="tab-ally" class="tab-pane">
            <div class="card" style="border-left: 4px solid var(--accent);">
                <small>指揮官情報:</small><br><b id="display-info"></b>
            </div>
            <div class="title">👥 味方リスト</div>
            <div id="member-edit-list"></div>
        </div>
        <div id="tab-settings" class="tab-pane">
            <div class="card"><div class="title">設定</div><p>目的地やデータの管理</p></div>
            <button class="auth-btn" style="background:#444;" onclick="localStorage.clear();location.reload();">ログアウト</button>
        </div>
    </div>
    <div class="footer">
        <div class="btn-grid" style="margin-bottom:8px;">
            <button class="action-btn" onclick="setMyRally(0)">単騎</button>
            <button class="action-btn" onclick="setMyRally(1)">1分</button>
            <button class="action-btn" onclick="setMyRally(5)">5分</button>
        </div>
        <button class="copy-all" onclick="copyInstructions()">📋 指示を一括コピー</button>
    </div>
</div>

<script>
    const DISCORD_URL = "https://discord.com/api/webhooks/1457262608020144316/5fAwUFmuZOcJLo4CDUGGbgmBpF8MZO6UsYdECuh_WxRIz6fXLxXcUokOcz69P1Ss4mxs";
    const MEMBER_DB = {
        "492822360": { name: "うめきち", key: "u8k2h260" },
        "493212867": { name: "ボンド", key: "b3d2i867" },
        "492059189": { name: "スミスミ", key: "s2m5i189" },
        "491154948": { name: "NOBU", key: "n1b5u948" },
        "491133240": { name: "ユフィ", key: "y1f3u240" },
        "492271392": { name: "スランバー", key: "s2u7a392" },
        "492055360": { name: "Do_rucy", key: "d0r5u360" },
        "491527765": { name: "れふく", key: "r1f2u765" },

        "491137229": { name: "久利生公平", key: "k1u3u229" },

        "491787053": { name: "ちゃら男", key: "c1a8o053" },
        "493183277": { name: "こーちゃん", key: "k3o8c277" },
        "493645404": { name: "ヘロヘロ", key: "h3l6a404" },

        "497820788": { name: "Ferdinand", key: "f7r2d788" },
        "492164518": { name: "おこおこ", key: "o2o6o518" },
        "615629018": { name: "ヒルチャール", key: "h1c2u018" }
    };

    let state = { destIdx: 0, destinations: ["王城"], members: [], enemies: [{id:1, name:"ターゲット1", remain:300, times:[15]}] };

    function showTab(t) {
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + t).classList.add('active');
        document.getElementById('btn-' + t).classList.add('active');
    }

    function processAuth() {
        const id = document.getElementById('id-input').value.trim();
        const key = document.getElementById('key-input').value.trim();
        const m = MEMBER_DB[id];
        if (m && m.key === key) {
            localStorage.setItem('wos_id', id);
            localStorage.setItem('wos_name', m.name);
            location.reload();
        } else {
            document.getElementById('auth-error').style.display = 'block';
        }
    }

    function render() {
        document.getElementById('display-info').innerText = `${localStorage.getItem('wos_name')} (ID:${localStorage.getItem('wos_id')})`;
        document.getElementById('dest-btns').innerHTML = state.destinations.map((d, i) => `<button class="action-btn ${state.destIdx===i?'active':''}" onclick="state.destIdx=${i};render();">${d}</button>`).join('');
        
        document.getElementById('target-list-area').innerHTML = state.enemies.map((e, i) => `
            <div class="card">
                <div style="display:flex; justify-content:space-between;">
                    <b>${e.name}</b> <span id="timer-${i}">0:00</span>
                </div>
            </div>`).join('');
    }

    window.onload = () => {
        if (!localStorage.getItem('wos_id')) {
            document.getElementById('auth-screen').style.display = 'flex';
        } else {
            document.getElementById('main-app').style.display = 'flex';
            render();
            setInterval(() => {
                document.getElementById('masterClock').innerText = new Date().toLocaleTimeString('ja-JP', {hour12:false});
            }, 1000);
        }
    };
</script>
</body>
</html>
